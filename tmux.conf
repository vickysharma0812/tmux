# set -g default-terminal "tmux-256color"
# set -ga terminal-overrides ",*256col*:Tc"
# set -ga terminal-overrides ",xterm-256color:Tc"
# set -ga terminal-overrides '*:Ss=\E[%p1%d q:Se=\E[ q'
# set-environment -g COLORTERM "truecolor"

set -g default-terminal "$TERM"
set -ag terminal-overrides ",$TERM:Tc"

## Mouse enable
set -g mouse on

## windows indexing
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

## My kemaps

### Prefix
# unbind C-b
# set -g prefix C-a
# bind C-a send-prefix

set-option -g prefix C-a
set-option -g prefix2 C-Space

### Reload config file
bind r source ~/.config/tmux/tmux.conf

## EASIFEM Popup related
# bind-key -n M-1 run-shell '~/.config/tmux/scripts/popupTerminal.sh'
# bind-key -n C-M-z run-shell '~/.config/tmux/scripts/buildBase.sh'
# bind-key -n C-M-Z run-shell '~/.config/tmux/scripts/installBase.sh'
# bind-key -n C-M-x run-shell '~/.config/tmux/scripts/buildClasses.sh'
# bind-key -n C-M-X run-shell '~/.config/tmux/scripts/installClasses.sh'

### Pane related
bind '"' split-window -v -c "#{pane_current_path}"
bind '-' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind Enter split-window -h -c "#{pane_current_path}"
bind '|' split-window -h -c "#{pane_current_path}"

bind h select-pane -L
bind l select-pane -R
bind k select-pane -U
bind j select-pane -D

## to enable yazi image preview to work correctly in tmux
set -g allow-passthrough on
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
# set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'sainnhe/tmux-fzf'
set -g @plugin 'tmux-plugins/tmux-cpu'
set -g @plugin 'tmux-plugins/tmux-battery'
set -g @plugin 'tmux-plugins/tmux-sessionist' ## manage session easily
set -g @plugin 'joshmedeski/tmux-nerd-font-window-name'

# theme  start
set -g @catppuccin_flavor 'mocha' # latte, frappe, macchiato or mocha
set -g @catppuccin_window_text "#W"
set -g @catppuccin_window_current_text "#W"
set -g @catppuccin_window_status_style "slanted" # basic, rounded, slanted, custom, none
set -g @catppuccin_status_left_separator "" # rounded session and right-side modules
set -g @catppuccin_status_right_separator ""
set -g @catppuccin_window_current_number_color "#{@thm_peach}" # orange active tab
set -g @catppuccin_window_current_left_separator "#[fg=#{@_ctp_status_bg},reverse]#[none]" # rounded outer edges on active tab
set -g @catppuccin_window_current_right_separator "#[fg=#{@_ctp_status_bg},reverse]#[none]"
run ~/.config/tmux/plugins/catppuccin/tmux/catppuccin.tmux
set -g window-status-separator "  " # gap between window tabs (default is one space)
set -g status-justify absolute-centre # centre window tabs on the whole status bar
set -g status-left-length 100
set -g status-left "#{E:@catppuccin_status_session}"
set -ag status-left "#[default]  " # gap between session tab and first window tab
set -g status-right-length 100
set -g status-right "#{E:@catppuccin_status_application}"
set -ag status-right "#[default]  " # gap between right-side modules
set -agF status-right "#{E:@catppuccin_status_cpu}"
set -ag status-right "#[default]  "
set -ag status-right "#{E:@catppuccin_status_uptime}"
set -ag status-right "#[default]  "
set -agF status-right "#{E:@catppuccin_status_battery}"
# theme ends


## Session related
## Start of sesh
## The following is related to the sesh
## Reference: https://github.com/joshmedeski/sesh
## bind-key "T" will open a popup using fzf
bind-key x kill-pane         # skip "kill-pane 1? (y/n)" prompt
set -g detach-on-destroy off # don't exit from tmux when closing a session
# bind -n "M-Space" run-shell '~/.config/tmux/scripts/runSesh-fzf.sh'
bind -n "M-Space" display-popup -E -w 80% -h 70% -d '#{pane_current_path}' -T 'Sesh' tv sesh
bind-key "K" display-popup -h 90% -w 50% -E "sesh picker -i"

bind-key "T" run-shell "sesh connect \"$(
  sesh list --icons | fzf-tmux -p 80%,70% \
    --no-sort --ansi --border-label ' sesh ' --prompt '⚡  ' \
    --header '  ^a all ^t tmux ^g configs ^x zoxide ^d tmux kill ^f find' \
    --bind 'tab:down,btab:up' \
    --bind 'ctrl-a:change-prompt(⚡  )+reload(sesh list --icons)' \
    --bind 'ctrl-t:change-prompt(🪟  )+reload(sesh list -t --icons)' \
    --bind 'ctrl-g:change-prompt(⚙️  )+reload(sesh list -c --icons)' \
    --bind 'ctrl-x:change-prompt(📁  )+reload(sesh list -z --icons)' \
    --bind 'ctrl-f:change-prompt(🔎  )+reload(fd -H -d 2 -t d -E .Trash . ~)' \
    --bind 'ctrl-d:execute(tmux kill-session -t {2..})+change-prompt(⚡  )+reload(sesh list --icons)' \
    --preview-window 'right:55%' \
    --preview 'sesh preview --watch {}'
)\""

bind-key -n "M-1" display-popup -E -w 90% -h 90% -d '#{pane_current_path}' -T 'easifemBase' tv easifembase
bind-key -n "M-2" display-popup -E -w 90% -h 90% -d '#{pane_current_path}' -T 'easifemClasses' tv easifemclasses
bind-key -n "M-3" display-popup -E -w 90% -h 90% -d '#{pane_current_path}' -T 'easifemDocs' tv easifemdocs
bind-key -n "M-4" display-popup -E -w 90% -h 90% -d '#{pane_current_path}' -T 'easifemTests' tv easifemtests
bind-key -n "M-s" display-popup -E -w 90% -h 90% -d '#{pane_current_path}' -T 'easifem' tv easifem

# The default <prefix>+L command will "Switch the attached client back to the last session."
# However, if you close a session while detach-on-destroy off is set,
# the last session will not be found.
# To fix this, I have a sesh last command that will always switch the
# client to the second to last session that has been attached.
bind -N "last-session (via sesh) " L run-shell "sesh last"
## End of sesh

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
